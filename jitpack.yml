# JitPack build configuration.
#
# JitPack builds a public Maven artifact per git tag on demand: when a consumer requests
# `com.github.Fluent-Health:featbit-android-sdk:<tag>`, JitPack clones the tag, runs
# `./gradlew publishToMavenLocal`, and serves whatever landed in `~/.m2`.
#
# The install command below matches what a maintainer would run locally, so a consumer
# fetching from JitPack sees the same AAR + sources jar + POM as `publishToMavenLocal`.
#
# JDK 17 matches the toolchain the CI workflow uses; both library modules target JVM 11,
# so the compile toolchain and target bytecode are independent.
jdk:
  - openjdk17

install:
  - ./gradlew :featbit-client:publishToMavenLocal :featbit-client-android:publishToMavenLocal
